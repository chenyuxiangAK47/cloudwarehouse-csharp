name: DAST ZAP Baseline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build backend
        run: dotnet publish CloudWarehouse.Backend/CloudWarehouse.Backend.csproj -c Release -o ./publish-dast

      - name: Start API for DAST
        run: |
          cd publish-dast
          nohup dotnet CloudWarehouse.Backend.dll --urls http://127.0.0.1:5088 > ../dast-app.log 2>&1 &
          echo $! > ../dast-app.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5088/ >/dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start"; cat ../dast-app.log; exit 1

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:5088"
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-baseline
          path: |
            report_html.html
            report_md.md
            report_json.json
            dast-app.log
          if-no-files-found: warn
