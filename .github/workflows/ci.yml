name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore CloudWarehouse.sln

      - name: Install Playwright Chromium (UI E2E)
        run: |
          dotnet build CloudWarehouse.E2ETests/CloudWarehouse.E2ETests.csproj -c Release
          # Microsoft.Playwright ships playwright.ps1 (not .sh) into the build output
          pwsh CloudWarehouse.E2ETests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Test with coverage
        run: |
          dotnet test CloudWarehouse.sln -c Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --verbosity normal 2>&1 | tee test-output.txt

      - name: Playwright UI E2E (formal log + TRX)
        run: |
          mkdir -p e2e-results
          dotnet test CloudWarehouse.E2ETests/CloudWarehouse.E2ETests.csproj -c Release \
            --no-build \
            --filter "Category=E2E" \
            --logger "trx;LogFileName=e2e-playwright.trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./e2e-results \
            2>&1 | tee e2e-playwright-test.txt

      - name: Upload Playwright E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-results
          path: |
            e2e-playwright-test.txt
            e2e-results/
          if-no-files-found: warn

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.4.1

      - name: Generate coverage report
        run: >
          reportgenerator
          "-reports:coverage/**/coverage.cobertura.xml"
          "-targetdir:coveragereport"
          "-reporttypes:Html;TextSummary"

      - name: Print coverage summary
        run: cat coveragereport/Summary.txt

      - name: NuGet vulnerability scan (dependency SAST)
        continue-on-error: true
        run: |
          echo "Scanning for known vulnerable packages..."
          dotnet list CloudWarehouse.sln package --vulnerable --include-transitive > vulnerable-packages.txt 2>&1 || true
          cat vulnerable-packages.txt

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport/

      - name: Upload raw coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: coverage/

      - name: Upload NuGet vulnerability scan
        uses: actions/upload-artifact@v4
        with:
          name: nuget-vulnerable-scan
          path: vulnerable-packages.txt

      - name: Build QA report site (GitHub Pages)
        run: |
          mkdir -p site/coverage site/e2e
          cp -r coveragereport/* site/coverage/
          if [ -f e2e-playwright-test.txt ]; then cp e2e-playwright-test.txt site/e2e/; fi
          if [ -d e2e-results ]; then cp -r e2e-results/* site/e2e/ 2>/dev/null || true; fi
          python3 tools/generate_qa_report.py test-output.txt site

      - name: Upload QA report site
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-site
          path: site/
