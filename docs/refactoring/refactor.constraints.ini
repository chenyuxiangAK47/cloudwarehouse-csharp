; 云仓模块化重构 — AI / 开发者强制约束（开发前必读）
; 完整说明见同目录：开发前必读-模块化重构.md
; 优先级：师傅生产交付 100% > NUS 学术展示

[meta]
version=1
goal=一份代码，两种交付叙事
production=单 exe + SQL Server + 启动云仓.bat
academic=模块化边界 + Pricing.Core + 可选 Pricing.Api 演示

[red_lines]
; 绝对禁止（违反即失败）
no_logic_change=双轨算价、取整、面单费、Excel 解析、导出、运单处理 — 仅允许物理平移
no_publish_change=自包含 zip、启动云仓.bat、单 exe、无额外进程
no_microservice_in_main=主项目不得引入网关/服务发现/Docker 依赖
no_db_split=不拆库、不改连接串、不改 Dapper 数据访问逻辑（Phase2 新表除外须单独评审）

[iron_rules]
atomic_steps=一次一个最小动作，改完立刻 dotnet build
grep_before_move=移动类前全 solution 搜索引用
build_after_each=每步编译；核心逻辑跑对应测试
compat_over_abstraction=不强行加 Repository/Domain 分层
demo_isolated=演示 API 只引用 Core，主项目不得依赖演示项目

[execution_order]
step1=仅新增 Modules 空目录 + CloudWarehouse.Pricing.Core 空项目，不移动代码
step2=平移纯计算到 Core（PriceCalculator 等），验证算价结果一致
step3=Backend 内 Modules 文件夹拆分，平移 Controller/Service/Helper
step4=新增 CloudWarehouse.Pricing.Api 演示项目，不侵入 Backend，不进 publish
step5=全量回归 + publish-self-contained.ps1 验证发布包
status=step1-step5_completed_2026-06-28

[self_check]
q1=是否改了计费/取整/Excel 逻辑？
q2=是否过度抽象？
q3=是否把 Docker 放进 publish 目录？
q4=是否改了 appsettings/Program/启动 bat？
q5=是否一次改超过 10 文件未编译？
q6=主项目是否依赖演示 API？
q7=是否新增微服务相关 NuGet？
q8=是否遗漏引用导致编译/运行失败？
q9=是否加入无实际作用的微服务代码？

[production_acceptance]
single_exe=是
bat_unchanged=是
import_calc_export_identical=是
no_extra_runtime=是

[academic_acceptance]
module_folders_clear=是
pricing_core_standalone=是
pricing_api_optional=是
report_narrative=模块化单体 → 可演进微服务

[fallback]
when_unsure=只新增文件/项目，不修改存量生产代码
